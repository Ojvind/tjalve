name: tjalve

services:
    api:
        build: ./apps/api
        restart: always
        expose:
            - 4000
        depends_on:
            mongo:
                condition: service_healthy
        environment:
            - SECRET=${SECRET}
            - DATABASE_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/tjalve?authSource=admin
            - PORT=4000
        networks:
            default:
            yggdrasil_default:
                aliases:
                    - tjalve-api

    mongo:
        image: mongo
        restart: always
        environment:
            - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
            - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
        volumes:
            - mongodb:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

volumes:
    mongodb:

networks:
    yggdrasil_default:
        external: true
